name: Manual public APK phone captures
on:
  workflow_dispatch:
    inputs:
      sdk_and_challenge_ack:
        description: Approve the exact pinned Android SDK license and anonymous pairing challenge
        required: true
        type: boolean
        default: false
      free_public_runner_verified:
        description: Owner verified this is a standard free public-repository Linux runner
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-apk-phone-capture
  cancel-in-progress: false
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false && inputs.sdk_and_challenge_ack == true && inputs.free_public_runner_verified == true
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PHONE_CAPTURE_APPROVED: 'true'
      PUBLIC_STANDARD_RUNNER_VERIFIED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Synthetic guard tests only
        run: python3 -I -B capture-phone.py --self-test
      - name: Permit KVM on disposable runner only
        run: |
          set -euxo pipefail
          printf 'KVM_HOST cpus=%s architecture=%s\n' "$(nproc)" "$(uname -m)"
          # Apply GitHub's documented static-node rule before asserting that
          # the device exists. A fresh runner need not expose it beforehand.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          if ! test -c /dev/kvm; then
            echo 'KVM_DEVICE_MISSING_AFTER_UDEV'
            lsmod | awk 'NR == 1 || $1 ~ /^kvm/ {print}'
            exit 1
          fi
          stat --format='KVM_DEVICE type=%F mode=%a owner=%U group=%G' /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            echo 'KVM_DEVICE_PERMISSION_DENIED'
            exit 1
          fi
      - name: Capture genuine Android phone pairing and privacy UI
        id: capture
        run: python3 -I -B capture-phone.py --run
      - name: Retain PNGs and sanitized evidence only
        if: always() && steps.capture.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-phone-${{ github.run_id }}
          path: ${{ runner.temp }}/public-apk-phone-capture/artifacts/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
